<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Crazy Snake Game</title>
    <link rel="stylesheet" href="style.css">  
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">  
</head>
<body>
    <div id="score">Score: 0000</div> <div id="time">00:00</div>
    <div id="highScore">HighScore: 0000</div>
    <div id="ZoomWrapper">
    <div class="game-wrapper">
        <div class="container">
            <div class="game-area">
                <div id="loading">Loading...</div>
                <h1 id="gameTitle">Crazy Snake Game</h1>
                <div id="countdown"></div>
                <div id="startWarning">You should Start Game First!</div>
                <canvas id="game" width="400" height="400"></canvas>
            </div>
            <div class="controls">
                <div class="row">
                    <button id="upBtn" onclick="setDirection('up')" style="background:#3498db;">Up</button>
                </div>
                <div class="row middle">
                    <button id="leftBtn" onclick="setDirection('left')" style="background:#2ecc71;">Left</button>
                    <button id="rightBtn" onclick="setDirection('right')" style="background:#f1c40f;">Right</button>
                </div>
                <div class="row">
                    <button id="downBtn" onclick="setDirection('down')" style="background:#e74c3c;">Down</button>
                </div>
            </div>
        </div>
    </div>
    <div id="optionsMenu" class="options-menu">
        <div class = "options-box">
            <h2 id ="optionsTitle">Options</h2>
             <button id="soundToggleBtn" onclick = "toggleSound()" style = "margin: 25px auto 25px auto; width:220px; height:45px; font-size: 18px; background: #3498db;">Sound : Not Muted</button>
             <button id="speedBtn" onclick="toggleSpeedMenu()" style = "margin:0 auto 15px auto; width:220px; height:45px; font-size:18px; background:#16a085; color:black">Speed : Normal</button>
             <div id="languageContainer">
             <button id="languageBtn" onclick="toggleLanguageMenu()" style="margin:0 auto 15px auto; width:220px; height:45px; font-size:18px; background:#9b59b6; color:white;">Language</button>
            <div id="languageMenu" class="language-menu">
                <div onclick="selectLanguage('en')">English</div>
                <div onclick="selectLanguage('fr')">Français</div>
                <div onclick="selectLanguage('es')">Español</div>
                <div onclick="selectLanguage('ru')">Русский</div>
                <div onclick="selectLanguage('ar')">اللغة العربية</div>
            </div> 
            <button id="gameQRBtn" style="margin:0 auto 15px auto; width:220px; height:45px; font-size:18px; background:#e67e22; color:black;">Game QR Code</button>
            </div>
               <label id="screenSizeLabel" style="display:block; margin-top:15px;">Screen Size</label>
               <input type="range" id="sizeSlider" min="50" max="100" value="100">
               <button id="closeBtn" class="shopCloseBtn" onclick="toggleOptions()">Close</button>
            </div>
             </div>
             <div id="qrModal">
                <div id="qrBox">
                    <h3 id="qrTitle">Scan Crazy Snake Game</h3>
                    <img src="SnakeQR.png" id="qrImage" alt="Game QR Code">
                    <button id="closeQRBtn" class="shopCloseBtn">Close</button>
                </div>
             </div>
  <div id="shopMenu" class="options-menu">
        <div class ="options-box">
            <h2>Shop</h2>
            <div id="shopContent">
              <button class="shop-item red-snake" onclick="trySelectSkin('red')">Red Snake</button>
              <button class="shop-item blue-snake" onclick="trySelectSkin('blue')">Blue Snake</button>
              <button class="shop-item default-snake" onclick="playClick(); setSnakeSkin('default'); toggleShop();" style="background: green; color:white;">Default Snake</button>
            </div>
            <div id="shopMessage" style="display:none; color:rgb(30, 181, 30); font-size:18px; background:none; position:absolute; top:145px; left:50%; transform:translateX(-50%);"></div>
            <button id="shopCloseBtn" class="shopCloseBtn" onclick="toggleShop()">close</button>
        </div>
    </div>      
</div> <!-- zoomWrapper -->
    <div class="buttons">
        <button id="startBtn" onclick="handleStartPause()">Start</button>
        <button class="restart-btn" onclick="restartGame()" disabled>Restart</button>
         <button class="options-btn" onclick="toggleOptions()">Options</button>
         <button class="shop-btn" onclick="openShop()" title="Coming Soon">Shop</button>
         <button class="about-btn" onclick="goToAbout()">About Us</button>
        <button class="exit-btn" onclick="exitGame()">Exit</button>
    </div>
    <div class="version-label">Version 1.77</div>
    <div class="signature">
        <div class="by-jawad">By Jawad Jammoul</div>
        <div>&#169; 2026 All Right Reserved</div>
    </div>
    <script src="game.js"></script>
</body>
</html>
